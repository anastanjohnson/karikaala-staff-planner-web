name: Build Firebase Hosting release
on:
  push:
    branches: [main]
    paths: ['flutter/**', 'firebase.json', '.firebaserc', '.github/workflows/firebase-hosting.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-hosting-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter
      - run: flutter test
        working-directory: flutter
      - run: flutter build web --release --base-href /
        working-directory: flutter
      - run: python3 tool/version_web.py
        working-directory: flutter
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-hosting-web
          path: flutter/build/web
          retention-days: 14
