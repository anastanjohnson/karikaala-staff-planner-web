<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18251f"><title>KARIKAALA Staff Planner</title>
<style>:root{font-family:Inter,system-ui,sans-serif;color:#17231e;background:#f4f6f4}*{box-sizing:border-box}body{margin:0}.hidden{display:none!important}.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#14241d,#304b3d)}.login-card{width:min(410px,100%);background:#fff;border-radius:22px;padding:34px;box-shadow:0 20px 70px #0005;text-align:center}.brand-mark{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:#202221;color:#fff;font-size:44px;font-weight:800}.login-card h1{letter-spacing:.16em;margin:12px 0 2px}.login-card p{color:#65726b}label{display:block;text-align:left;font-weight:650;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid #cdd5d0;border-radius:10px;margin-top:7px;font-size:16px}button{border:0;border-radius:9px;background:#1f352a;color:white;padding:13px 18px;font-weight:700;cursor:pointer}.login-card form button{width:100%;margin-top:12px}.error{color:#b1473d!important}.app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}aside{background:#17251f;color:white;padding:27px 22px;display:flex;flex-direction:column;gap:5px}.side-mark{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#17251f;font-size:26px;font-weight:800;margin-bottom:10px}aside strong{letter-spacing:.12em}aside span{color:#aebbb4;font-size:13px}nav{display:grid;gap:8px;margin-top:40px}nav button,.logout{background:transparent;text-align:left;color:#bbc5c0}.active{background:#2f4a3d!important;color:white!important}.logout{margin-top:auto}.workspace{padding:34px;overflow:auto}.workspace>header{display:flex;align-items:center;justify-content:space-between}.workspace small{letter-spacing:.14em;color:#6b786f}.workspace h1{margin:5px 0;font-size:30px}.status{margin:24px 0 15px;background:white;border:1px solid #dbe1dd;border-radius:10px;padding:12px}.week{display:grid;grid-template-columns:repeat(7,minmax(160px,1fr));gap:12px}.day{background:white;border:1px solid #d8dfda;border-radius:13px;min-height:250px;padding:13px}.day>header{display:flex;justify-content:space-between;border-bottom:1px solid #e7ebe8;padding-bottom:11px}.day>header span{color:#718077;font-size:12px}.shift{margin-top:10px;border:1px solid #a9c6b5;background:#edf5f0;border-radius:9px;padding:10px;display:grid;gap:6px}.shift span{font-size:13px;color:#4d6256}.empty{grid-column:1/-1;padding:45px;background:white;border:1px dashed #abb7b0;border-radius:13px;text-align:center;color:#68756e}@media(max-width:900px){.app{grid-template-columns:1fr}aside{display:none}.workspace{padding:18px}.week{grid-template-columns:1fr}.workspace>header{align-items:flex-start;gap:10px}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<main id="login" class="login-shell"><section class="login-card"><div class="brand-mark">K</div><h1>KARIKAALA</h1><p>Staff Planner</p><form id="login-form"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p id="login-error" class="error"></p></form></section></main>
<main id="app" class="app hidden"><aside><div class="side-mark">K</div><strong>KARIKAALA</strong><span>Staff Planner</span><nav><button class="active">Weekly plan</button><button>Staff</button><button>Published</button><button>Messages</button></nav><button id="logout" class="logout">Sign out</button></aside><section class="workspace"><header><div><small>WEEKLY PLAN</small><h1>Staff schedule</h1></div><div id="identity"></div></header><div id="status" class="status">Connecting to the live schedule…</div><section id="week" class="week"></section></section></main>
<script>const client=supabase.createClient('https://tyehobosgcyukavvucsv.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5ZWhvYm9zZ2N5dWthdnZ1Y3N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MzUxMzEsImV4cCI6MjEwNTIxMTEzMX0.J1JetwT-MYFzzfryAtSU2HvXMpnwj6hvBS1WSY2Lw-I');const el=id=>document.getElementById(id);function loginEmail(name){const v=name.trim().toLowerCase();return v==='ramanan'?'anastan.johnson@sailygroup.com':v.includes('@')?v:v+'@staff.karikaala.app'}function renderPlan(plan={}){const days=plan.days||plan.week||[];if(!Array.isArray(days)||!days.length){el('week').innerHTML='<div class="empty"><b>The live planner is connected.</b><br>The first schedule will appear here after the Firebase roster is imported.</div>';return}el('week').innerHTML=days.map(day=>'<article class="day"><header><b>'+(day.label||day.day||'')+'</b><span>'+((day.slots||[]).length)+' slots</span></header>'+((day.slots||[]).map(slot=>'<div class="shift"><b>'+(slot.time||(slot.start+' – '+slot.end))+'</b><span>'+(slot.staffName||'Open')+'</span></div>').join('')||'<p>Closed</p>')+'</article>').join('')}async function load(){const s=await client.auth.getSession(),session=s.data.session;el('login').classList.toggle('hidden',!!session);el('app').classList.toggle('hidden',!session);if(!session)return;const p=await client.from('profiles').select('display_name,role').eq('id',session.user.id).single(),profile=p.data;el('identity').textContent=profile?profile.display_name+' · '+profile.role:session.user.email;const refresh=async()=>{const r=await client.from('planner_state').select('plan,revision,updated_at').eq('id',true).single();el('status').textContent=r.error?'The schedule could not be loaded.':'Live · revision '+r.data.revision;if(r.data)renderPlan(r.data.plan)};await refresh();client.channel('planner-web').on('postgres_changes',{event:'*',schema:'public',table:'planner_state'},refresh).subscribe()}el('login-form').addEventListener('submit',async e=>{e.preventDefault();el('login-error').textContent='';const r=await client.auth.signInWithPassword({email:loginEmail(el('username').value),password:el('password').value});if(r.error)el('login-error').textContent='Username or password is incorrect.';else load()});el('logout').addEventListener('click',async()=>{await client.auth.signOut();location.reload()});client.auth.onAuthStateChange(()=>load());load();</script></body></html>
