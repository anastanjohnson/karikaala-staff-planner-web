<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174b2d"><title>KARIKAALA Staff Planner</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--green:#176235;--green2:#258a4b;--mint:#eef8f0;--ink:#111827;--muted:#687386;--line:#dfe5e9;--paper:#fff;--bg:#f7f9fa;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0d3820,#2a7547);padding:24px}.login-card{width:min(420px,100%);padding:34px;border-radius:24px;background:white;box-shadow:0 28px 80px #061b1055;text-align:center}.mark{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#152a1e;color:#fff;font-size:36px;font-weight:900}.login h1,.brand b{letter-spacing:.08em}.login label{display:block;text-align:left;font-weight:700;margin:18px 0 6px}.login input,.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:white}.primary{border:0;border-radius:10px;background:var(--green);color:white;padding:13px 18px;font-weight:750;cursor:pointer}.login .primary{width:100%;margin-top:20px}.error{color:#bd3f35;min-height:20px}.shell{min-height:100vh;display:grid;grid-template-columns:240px minmax(620px,1fr) 350px;grid-template-rows:92px 1fr}.side{grid-row:1/3;background:white;border-right:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:0 12px}.leaf{font-size:34px}.brand span{display:block;font-size:13px;color:var(--muted);letter-spacing:0}.nav{display:grid;gap:8px;margin-top:34px}.nav button{border:0;background:transparent;border-radius:12px;text-align:left;padding:14px 18px;font-weight:650;color:#253043;cursor:pointer}.nav button.active{background:#eaf4ed;color:#17532f}.logout{margin-top:auto}.top{grid-column:2/4;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:17px 34px}.title{min-width:315px}.title h1{font-size:24px;margin:0}.title p{margin:3px 0 0;color:var(--muted)}.search-wrap{max-width:430px;flex:1;margin-left:auto}.profile{display:flex;align-items:center;gap:11px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e4e9ee;font-weight:800}.main{padding:25px 34px;overflow:auto}.rail{border-left:1px solid var(--line);padding:19px 16px;background:#fafbfb;overflow:auto}.toolbar{display:flex;align-items:center;gap:12px}.iconbtn,.select,.outline{background:white;border:1px solid #d6dde2;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.toolbar h2{margin:0 8px;font-size:27px}.toolbar .select{margin-left:auto}.progress-card,.day-panel,.rail-card{background:white;border:1px solid var(--line);border-radius:13px}.progress-card{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:17px 20px;margin:18px 0}.progress-card b{font-size:17px}.bar{height:10px;background:#e6eaed;border-radius:99px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2e984e,#278344);border-radius:99px}.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin-bottom:19px}.date-card{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;text-align:left;cursor:pointer}.date-card strong{display:block;font-size:17px;margin:3px 0}.date-card small{color:var(--muted)}.date-card.active{border-color:#49a367;background:#eef8f1}.date-card.closed{background:#f3f4f5;color:#858d98}.date-card.problem{background:#fff4f2;border-color:#efcbc5}.mini{height:5px;background:#e5e9ec;border-radius:9px;margin-top:8px;overflow:hidden}.mini i{display:block;height:100%;background:#349356}.day-panel{padding:20px;margin-bottom:17px}.day-head{display:flex;align-items:center;justify-content:space-between}.day-head h2{font-size:21px;margin:0}.slot{display:grid;grid-template-columns:minmax(170px,1fr) minmax(170px,1fr) auto;align-items:center;gap:18px;border:1px solid #d6dde2;border-radius:10px;margin-top:10px;padding:14px 16px;cursor:pointer}.slot.assigned{border-color:#badbc5;background:linear-gradient(90deg,#f0faf3,#e8f5ec);box-shadow:inset 4px 0 #2fa45b}.slot.selected{outline:2px solid #278249}.slot-time b{font-size:16px}.muted{color:var(--muted);font-size:13px}.person{display:flex;align-items:center;gap:10px;font-weight:700}.person .avatar{width:34px;height:34px;font-size:12px}.badge{border-radius:999px;background:#ddefe2;color:#176137;padding:5px 9px;font-size:12px}.rail>.primary{width:100%;font-size:15px}.rail-card{padding:16px;margin-top:17px}.rail-card h3{margin:0 0 14px}.detail{padding:14px;border-radius:10px;background:linear-gradient(135deg,#eef8f1,#e6f2e9);line-height:1.9}.staff-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e8ecef;cursor:pointer}.staff-row:last-child{border:0}.staff-row:hover{background:#f7faf8}.staff-row .avatar{width:36px;height:36px}.hours{display:flex;align-items:center;gap:8px;padding:7px 0}.hours .bar{margin:0;flex:1;height:8px}.view{display:none}.view.active{display:block}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:20px}.data-row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #ebeff1}.data-row:last-child{border:0}@media(max-width:1180px){.shell{grid-template-columns:210px 1fr}.rail{display:none}.top{grid-column:2}.weekstrip{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){.shell{display:block}.side{display:none}.top{padding:15px}.title p,.search-wrap{display:none}.main{padding:16px}.weekstrip{grid-template-columns:repeat(2,1fr)}.slot{grid-template-columns:1fr}.toolbar h2{font-size:20px}}
</style></head><body>
<main id="login" class="login"><section class="login-card"><div class="mark">K</div><h1>KARIKAALA</h1><p>Staff Planner</p><form id="login-form"><label>Username<input id="username" required autocomplete="username"></label><label>Password<input id="password" required type="password" autocomplete="current-password"></label><button class="primary">Sign in</button><p id="login-error" class="error"></p></form></section></main>
<div id="app" class="shell hidden"><aside class="side"><div class="brand"><span class="leaf">🌿</span><div><b>KARIKAALA</b><span>Staff Planner</span></div></div><nav class="nav"><button data-view="plan" class="active">▣　Plan</button><button data-view="staff">♙　Staff</button><button data-view="published">◉　Published</button><button data-view="messages">◯　Messages</button></nav><button id="logout" class="nav logout">↪　Sign out</button></aside><header class="top"><div class="title"><h1>KARIKAALA Staff Planner</h1><p>Plan. People. A Stronger Tomorrow.</p></div><div class="search-wrap"><input id="search" class="search" placeholder="⌕  Search staff, shifts or messages..."></div><div class="profile"><div class="avatar" id="initials">R</div><div><b id="profile-name">Manager</b><div class="muted" id="profile-role">Manager</div></div></div></header>
<main class="main"><section id="plan-view" class="view active"><div class="toolbar"><button id="prev" class="iconbtn">‹</button><h2 id="week-title">Week</h2><button id="next" class="iconbtn">›</button><button class="iconbtn">▣</button><button class="select">Weekly Draft⌄</button></div><div class="progress-card"><div><b id="progress-label">0 slots assigned</b><div class="bar"><i id="progress-bar" style="width:0"></i></div></div><span id="progress-percent">0%</span></div><div id="weekstrip" class="weekstrip"></div><div id="days"></div></section><section id="staff-view" class="view"><div class="panel"><h2>Staff</h2><div id="staff-list"></div></div></section><section id="published-view" class="view"><div class="panel"><h2>Published rosters</h2><div id="published-list"></div></div></section><section id="messages-view" class="view"><div class="panel"><h2>Messages</h2><div id="message-list"></div></div></section></main>
<aside class="rail"><button id="publish" class="primary">➤　Publish week</button><section class="rail-card"><h3>Shift details</h3><div id="details" class="detail">Select a shift to view its details.</div><h3 style="margin-top:22px">Available staff</h3><div id="available"></div><h3 style="margin-top:22px">Monthly hours</h3><div id="monthly"></div></section></aside></div>
<script>
const cfg={url:'https://tyehobosgcyukavvucsv.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5ZWhvYm9zZ2N5dWthdnZ1Y3N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MzUxMzEsImV4cCI6MjEwNTIxMTEzMX0.J1JetwT-MYFzzfryAtSU2HvXMpnwj6hvBS1WSY2Lw-I'};const client=supabase.createClient(cfg.url,cfg.key);const $=id=>document.getElementById(id);let plan={},revision=0,weekStart='2026-09-14',selected=null,profile=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clock=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;const date=d=>new Date(d+'T12:00:00');const key=d=>d.toISOString().slice(0,10);const plus=(d,n)=>{let x=date(d);x.setDate(x.getDate()+n);return key(x)};const fmt=(d,mode='short')=>new Intl.DateTimeFormat('en-GB',mode==='long'?{weekday:'long',day:'numeric',month:'short'}:{weekday:'short',day:'numeric',month:'short'}).format(date(d));const names=()=>Object.fromEntries((plan.staff||[]).map(p=>[p.id,p.name]));const loginEmail=n=>{n=n.trim().toLowerCase();return n==='ramanan'?'anastan.johnson@sailygroup.com':n.includes('@')?n:`${n}@staff.karikaala.app`};
function monday(d){let x=date(d),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return key(x)}function weekSlots(){return(plan.slots||[]).filter(s=>monday(s.date)===weekStart)}function monthHours(id){return(plan.slots||[]).filter(s=>s.staffId===id&&s.date.slice(0,7)===weekStart.slice(0,7)).reduce((n,s)=>n+s.end+(s.nextDay?1440:0)-s.start-(s.breakMinutes||0),0)/60}
function render(){const ns=names(),slots=weekSlots();$('week-title').textContent=`${fmt(weekStart).split(',').pop().trim()} – ${fmt(plus(weekStart,6)).split(',').pop().trim()}`;let assigned=slots.filter(s=>s.staffId).length,pct=slots.length?Math.round(assigned/slots.length*100):0;$('progress-label').textContent=`${assigned} of ${slots.length} slots assigned`;$('progress-percent').textContent=pct+'%';$('progress-bar').style.width=pct+'%';$('weekstrip').innerHTML=Array.from({length:7},(_,i)=>{let d=plus(weekStart,i),a=slots.filter(s=>s.date===d),done=a.filter(s=>s.staffId).length,closed=i===1||i===2;return`<button class="date-card ${closed?'closed':done===a.length&&a.length?'active':!done&&a.length?'problem':''}" data-date="${d}"><span>${fmt(d).split(' ')[0]}</span><strong>${fmt(d).split(' ').slice(1).join(' ')}</strong><small>${closed?'Closed':`${done} / ${a.length}`}</small><div class="mini"><i style="width:${a.length?done/a.length*100:0}%"></i></div></button>`}).join('');$('days').innerHTML=Array.from({length:7},(_,i)=>plus(weekStart,i)).filter(d=>![2,3].includes(date(d).getDay())).map(d=>{let list=slots.filter(s=>s.date===d).sort((a,b)=>a.start-b.start);return`<section class="day-panel" id="day-${d}"><div class="day-head"><h2>${fmt(d,'long')}</h2><span class="muted">${list.filter(s=>s.staffId).length} of ${list.length} slots assigned　<button class="outline">＋ Add time slot</button></span></div>${list.map(s=>`<div class="slot ${s.staffId?'assigned':''} ${selected===s.id?'selected':''}" data-slot="${esc(s.id)}"><div class="slot-time"><b>${clock(s.start)} – ${clock(s.end)}</b><div class="muted">${esc(s.role||'Shift')}</div></div><div class="person">${s.staffId?`<div class="avatar">${esc((ns[s.staffId]||'?').slice(0,2).toUpperCase())}</div><span>${esc(ns[s.staffId]||'Staff')}</span><span class="badge">✓ Assigned</span>`:'<span>⊕　Assign staff</span>'}</div><b>⋮</b></div>`).join('')||'<p class="muted">No shifts planned.</p>'}</section>`}).join('');document.querySelectorAll('[data-slot]').forEach(e=>e.onclick=()=>{selected=e.dataset.slot;render();renderRail()});document.querySelectorAll('[data-date]').forEach(e=>e.onclick=()=>document.getElementById('day-'+e.dataset.date)?.scrollIntoView({behavior:'smooth'}));renderStaff();renderPublished();renderRail()}
function renderStaff(){let ns=names();$('staff-list').innerHTML=(plan.staff||[]).map(p=>`<div class="data-row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.id)}</div></div><span class="badge">${monthHours(p.id).toFixed(1)} hours this month</span></div>`).join('')}
function renderPublished(){let pubs=plan.published||{};$('published-list').innerHTML=Object.keys(pubs).sort().reverse().map(k=>{let p=pubs[k];return`<section><h3>Week of ${fmt(k,'long')}</h3><div class="muted">Revision ${p.revision} · ${new Date(p.publishedAt).toLocaleString()}</div>${(p.slots||[]).map(s=>`<div class="data-row"><b>${fmt(s.date)} · ${clock(s.start)} – ${clock(s.end)}</b><span>${esc(p.names[s.staffId]||'Staff')}</span></div>`).join('')}</section>`}).join('')||'<p class="muted">No published roster.</p>'}
async function renderMessages(){let{data,error}=await client.from('conversations').select('id,title,is_group,created_at').order('created_at',{ascending:false});$('message-list').innerHTML=error?'<p>Messages could not be loaded.</p>':(data||[]).map(c=>`<div class="data-row"><div><b>${esc(c.title)}</b><div class="muted">${c.is_group?'Group':'Personal'} conversation</div></div><span>›</span></div>`).join('')||'<p class="muted">No conversations yet.</p>'}
function renderRail(){let s=(plan.slots||[]).find(x=>x.id===selected),ns=names();if(!s){$('details').innerHTML='Select a shift to view its details.';$('available').innerHTML='';$('monthly').innerHTML='';return}$('details').innerHTML=`<b>▣　${fmt(s.date,'long')}</b><br>◷　${clock(s.start)} – ${clock(s.end)} (${((s.end-s.start)/60).toFixed(1)} hours)<br>♙　${esc(s.staffId?ns[s.staffId]||'Staff':'Open shift')}`;let off=plan.timeOff||[];$('available').innerHTML=(plan.staff||[]).filter(p=>!off.some(o=>o.staffId===p.id&&o.date===s.date&&o.start<s.end&&s.start<o.end)).map(p=>`<div class="staff-row" data-assign="${esc(p.id)}"><div class="avatar">${esc(p.name.slice(0,2).toUpperCase())}</div><div><b>${esc(p.name)}</b><div class="muted">${monthHours(p.id).toFixed(1)}h this month</div></div><span class="badge">Available</span></div>`).join('');document.querySelectorAll('[data-assign]').forEach(e=>e.onclick=()=>assign(s.id,e.dataset.assign));$('monthly').innerHTML=(plan.staff||[]).map(p=>`<div class="hours"><span style="width:65px">${esc(p.name)}</span><small>${monthHours(p.id).toFixed(0)}h</small><div class="bar"><i style="width:${Math.min(100,monthHours(p.id)/80*100)}%"></i></div></div>`).join('')}
async function save(next){let{error}=await client.from('planner_state').update({plan:next,revision:revision+1,updated_at:new Date().toISOString()}).eq('id',true).eq('revision',revision);if(error){alert('The plan changed on another device. Reload and try again.');return}plan=next;revision++;render()}
function assign(id,staffId){let next=structuredClone(plan),slot=next.slots.find(s=>s.id===id);slot.staffId=staffId;save(next)}
$('publish').onclick=async()=>{let slots=weekSlots(),open=slots.filter(s=>!s.staffId);if(open.length)return alert(`Assign all slots before publishing. ${open.length} still open.`);let next=structuredClone(plan),rev=((next.published||{})[weekStart]?.revision||0)+1;next.published=next.published||{};next.published[weekStart]={week:weekStart,slots:structuredClone(slots),names:names(),publishedAt:new Date().toISOString(),revision:rev};await save(next)};$('prev').onclick=()=>{weekStart=plus(weekStart,-7);render()};$('next').onclick=()=>{weekStart=plus(weekStart,7);render()};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(b.dataset.view+'-view').classList.add('active');if(b.dataset.view==='messages')renderMessages()});
async function load(){let{data:{session}}=await client.auth.getSession();$('login').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);if(!session)return;let{data:p}=await client.from('profiles').select('display_name,role').eq('id',session.user.id).single();profile=p;$('profile-name').textContent=p?.display_name||session.user.email;$('profile-role').textContent=p?.role||'Staff';$('initials').textContent=(p?.display_name||'U').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();let refresh=async()=>{let{data,error}=await client.from('planner_state').select('plan,revision').eq('id',true).single();if(error)return;plan=data.plan||{};revision=data.revision;weekStart=Object.keys(plan.published||{}).sort().pop()||monday(new Date().toISOString().slice(0,10));render()};await refresh();client.channel('planner-desktop').on('postgres_changes',{event:'*',schema:'public',table:'planner_state'},refresh).subscribe()}
$('login-form').onsubmit=async e=>{e.preventDefault();$('login-error').textContent='';let{error}=await client.auth.signInWithPassword({email:loginEmail($('username').value),password:$('password').value});if(error)$('login-error').textContent='Username or password is incorrect.';else load()};$('logout').onclick=async()=>{await client.auth.signOut();location.reload()};client.auth.onAuthStateChange(()=>load());load();
</script></body></html>
