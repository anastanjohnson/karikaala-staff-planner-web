version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.3.2
  firebase_core: ^3.15.2
